name: Tornado Scoring (Severe Season)

on:
  schedule:
    # Run every 6 hours to accumulate data while building the site.
    # Increase to hourly or 15-min when going live to public.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to score (YYYYMMDD, default: today)"
        required: false
        type: string

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy scipy
          pip install -e .

      - name: Run tornado scoring pipeline
        env:
          HAZARDPULSE_HRRR_CACHE: ${{ github.workspace }}/.cache/hrrr
          HAZARDPULSE_PROBSEVERE_CACHE: ${{ github.workspace }}/.cache/probsevere
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          python scripts/fetch_and_score_tornado.py $DATE_ARG

      - name: Verify output
        run: |
          python -c "
          import json
          with open('dist/data/live-tornadoes.json') as f:
              d = json.load(f)
          print(f'Storms scored: {d.get(\"n_active_storms\", 0)}')
          print(f'Model: {d.get(\"model_version\", \"unknown\")}')
          print(f'Tier: {d.get(\"scoring_tier\", \"unknown\")}')
          print(f'Tier label: {d.get(\"scoring_tier_label\", \"unknown\")}')
          assert 'disclaimer' in d, 'Missing disclaimer!'
          print('Output verification passed.')
          "

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dist/data/live-tornadoes.json dist/data/live-pulse.json dist/data/tornado-ledger.jsonl 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/data/live-tornadoes.json dist/data/live-pulse.json dist/data/tornado-ledger.jsonl
          git commit -m "data: tornado scoring update $(date -u +%Y-%m-%dT%H:%MZ)

          Automated scoring via fetch_and_score_tornado.py.
          Model: hp-tornado-coherence-v1 | Sources: ProbSevere v3, HRRR, CFT"
          git push
